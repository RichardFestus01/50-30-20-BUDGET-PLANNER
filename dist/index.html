<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./style.css" rel="stylesheet">
  <title>Budget Planner</title>
</head>
<body class="bg-gray-100 font-sans">
  <div class="container mx-auto p-4 md:p-8">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">50/30/20 Budget Planner</h1>
    <div class="text-center text-gray-600 mb-8 -mt-4">
      <span id="current-date"></span> &bull; <span id="current-time"></span>
    </div>

    <!-- Income Section -->
    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <h2 class="text-2xl font-semibold mb-4 text-gray-700 flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        Your Income
      </h2>
      <div class="mb-4">
        <input type="text" id="income-desc" placeholder="Income source (e.g., Salary)" class="p-2 border rounded-md w-full mb-2">
        <input type="number" id="income-amount" placeholder="Amount" class="p-2 border rounded-md w-full mb-2">
        <button id="add-income-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-300">Add Income</button>
      </div>
      <div id="income-list">
        <!-- Incomes will be added here -->
      </div>
    </div>

    <!-- Budget Breakdown -->
    <div class="grid md:grid-cols-4 gap-6 mb-8">
      <!-- Total Income -->
      <div class="bg-blue-100 p-6 rounded-lg shadow budget-card">
        <h3 class="text-xl font-semibold text-blue-800">Total Income</h3>
        <p id="total-income-amount" class="text-3xl font-bold text-blue-900 mt-2">₦0.00</p>
      </div>
      <!-- Needs -->
      <div class="bg-green-100 p-6 rounded-lg shadow budget-card">
        <h3 class="text-xl font-semibold text-green-800">Needs (50%)</h3>
        <p id="needs-amount" class="text-3xl font-bold text-green-900 mt-2">₦0.00</p>
        <p class="text-sm text-green-700 mt-1">Remaining: <span id="needs-remaining" class="font-semibold">₦0.00</span></p>
      </div>
      <!-- Wants -->
      <div class="bg-yellow-100 p-6 rounded-lg shadow budget-card">
        <h3 class="text-xl font-semibold text-yellow-800">Wants (30%)</h3>
        <p id="wants-amount" class="text-3xl font-bold text-yellow-900 mt-2">₦0.00</p>
        <p class="text-sm text-yellow-700 mt-1">Remaining: <span id="wants-remaining" class="font-semibold">₦0.00</span></p>
      </div>
      <!-- Savings -->
      <div class="bg-indigo-100 p-6 rounded-lg shadow budget-card">
        <h3 class="text-xl font-semibold text-indigo-800">Savings (20%)</h3>
        <p id="savings-amount" class="text-3xl font-bold text-indigo-900 mt-2">₦0.00</p>
        <p class="text-sm text-indigo-700 mt-1">Remaining: <span id="savings-remaining" class="font-semibold">₦0.00</span></p>
      </div>
    </div>

    <!-- Expenses and Chart -->
    <div class="grid md:grid-cols-2 gap-8">
      <!-- Expense Column -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-semibold mb-4 text-gray-700 flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          Track Expenses
        </h2>
        <div class="mb-4">
          <input type="text" id="expense-desc" placeholder="Expense description" class="p-2 border rounded-md w-full mb-2">
          <input type="number" id="expense-amount" placeholder="Amount" class="p-2 border rounded-md w-full mb-2">
          <select id="expense-category" class="p-2 border rounded-md w-full mb-2">
            <option value="needs">Needs</option>
            <option value="wants">Wants</option>
            <option value="savings">Savings</option>
          </select>
          <button id="add-expense-btn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded transition duration-300">Add Expense</button>
        </div>
        <div id="expense-list">
          <!-- Expenses will be added here -->
        </div>
      </div>

      <!-- Chart Flow -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-semibold mb-4 text-gray-700 flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
          </svg>
          Budget Overview
        </h2>
        <div id="chart-container">
            <div class="mb-4">
                <div class="flex justify-between mb-1">
                    <span class="text-base font-medium text-green-700">Needs</span>
                    <span id="needs-percentage" class="text-sm font-medium text-green-700">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4">
                    <div id="needs-bar" class="bg-green-500 h-4 rounded-full" style="width: 0%"></div>
                </div>
            </div>
            <div class="mb-4">
                <div class="flex justify-between mb-1">
                    <span class="text-base font-medium text-yellow-700">Wants</span>
                    <span id="wants-percentage" class="text-sm font-medium text-yellow-700">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4">
                    <div id="wants-bar" class="bg-yellow-500 h-4 rounded-full" style="width: 0%"></div>
                </div>
            </div>
            <div class="mb-4">
                <div class="flex justify-between mb-1">
                    <span class="text-base font-medium text-indigo-700">Savings</span>
                    <span id="savings-percentage" class="text-sm font-medium text-indigo-700">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4">
                    <div id="savings-bar" class="bg-indigo-500 h-4 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>
      </div>
    </div>

    <!-- Export Section -->
    <div class="bg-white p-6 rounded-lg shadow-md mt-8">
      <h2 class="text-2xl font-semibold mb-4 text-gray-700">Export Report</h2>
      <div>
        <button id="export-csv-btn" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded transition duration-300">Export as CSV</button>
      </div>
    </div>

    <!-- Settings Section -->
    <div class="bg-white p-6 rounded-lg shadow-md mt-8">
      <h2 class="text-2xl font-semibold mb-4 text-gray-700">Settings</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
        <div>
            <label for="currency-select" class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
            <select id="currency-select" class="p-2 border rounded-md w-full h-10">
                <option value="NGN">Nigerian Naira (₦)</option>
                <option value="USD">US Dollar ($)</option>
                <option value="EUR">Euro (€)</option>
                <option value="GBP">British Pound (£)</option>
                <option value="JPY">Japanese Yen (¥)</option>
                <option value="CAD">Canadian Dollar ($)</option>
                <option value="AUD">Australian Dollar ($)</option>
                <option value="CHF">Swiss Franc (CHF)</option>
                <option value="CNY">Chinese Yuan (¥)</option>
                <option value="INR">Indian Rupee (₹)</option>
                <option value="ZAR">South African Rand (R)</option>
                <option value="GHS">Ghanaian Cedi (GH₵)</option>
            </select>
        </div>
        <button id="clear-data-btn" class="w-full bg-transparent hover:bg-red-500 text-red-700 font-semibold hover:text-white py-2 px-4 border border-red-500 hover:border-transparent rounded transition duration-300 h-10">Clear All Data & Start Fresh</button>
      </div>
    </div>
  </div>
  <footer class="text-center text-gray-600 text-sm py-4">
    Developed by Emuemukoro Festus
  </footer>
  <script src="./app.js"></script>
</body>
</html>
